name: Refresh predictions

# Runs the prediction pipeline on GitHub's free runners and publishes the resulting static website to
# GitHub Pages. The laptop never has to be on, and nothing here depends on a token that expires.
# See DEPLOY.md for the one-time setup (enable Pages, first run).
on:
  schedule:
    - cron: "17 */2 * * *"  # every 2 hours: a LIGHT run - national teams, tennis, settling finished matches
    - cron: "41 5,17 * * *" # twice a day: a FULL run - also refetches results and refits the club-league models
  workflow_dispatch:
    inputs:
      mode:
        description: "full (everything, ~10 min) or light (national teams + tennis only, ~2 min)"
        type: choice
        options: [full, light]
        default: full

permissions:
  contents: write # keeps the database on the "state" release, and lets the keep-alive step commit
  pages: write    # publish the website
  id-token: write # GitHub Pages deployments prove themselves with an OIDC token

# Never two runs at once: they share one database. A run that's already going is allowed to
# finish (cancelling it mid-write would waste its work), and the next one queues behind it.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04 # pinned: "latest" jumps to a new OS image on GitHub's timetable, not ours
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      # First, before anything that can fail, so even a broken pipeline can't let the schedule lapse:
      # GitHub switches scheduled workflows off in a public repo after 60 days without activity.
      - name: Keep the schedule alive
        id: keepalive
        continue-on-error: true
        run: bash scripts/keepalive.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      # constraints.txt pins every package to the exact version the pipeline was tested with
      - run: pip install -r requirements.txt -c constraints.txt

      - name: Pick the mode for this run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "41 5,17 * * *" ]; then
            mode=full
          else
            mode=light
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "Running in $mode mode"

      # Downloaded history that never changes once fetched (completed seasons, finished days).
      # Losing it only costs a slower run, so a monthly key is plenty.
      - name: Restore downloaded history
        uses: actions/cache@v6
        with:
          path: |
            data/raw
            data/cache
          key: history-${{ steps.mode.outputs.month }}
          restore-keys: history-

      - name: Restore the prediction database
        run: bash scripts/ci_state.sh restore

      # A part that fails (a feed that's down) must not stop the site refreshing with whatever did
      # work, so this step is allowed to fail and the final step reports it AFTER publishing.
      - name: Run the pipeline
        id: pipeline
        continue-on-error: true
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            python src/predict.py
          else
            python src/predict.py --only intl tennis
          fi

      - name: Save the prediction database
        if: ${{ !cancelled() }}
        run: bash scripts/ci_state.sh save

      - name: Check the website data exists
        id: sitecheck
        if: ${{ !cancelled() }}
        run: |
          # never replace a working live site with one that has no data (e.g. the pipeline died before exporting)
          test -f server/public/data/predictions.json || { echo "::error::No predictions.json was produced - leaving the live site as it is."; exit 1; }

      - name: Package the website
        if: ${{ !cancelled() && steps.sitecheck.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: server/public

      - name: Publish to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && steps.sitecheck.outcome == 'success' }}
        uses: actions/deploy-pages@v5

      - name: Fail the run if something part-way broke
        if: ${{ steps.pipeline.outcome == 'failure' || steps.keepalive.outcome == 'failure' }}
        run: |
          echo "::error::Part of this run failed (see the 'Run the pipeline' and 'Keep the schedule alive' steps). The site was still refreshed with everything that worked."
          exit 1
